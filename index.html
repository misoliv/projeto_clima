<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Previsão do Tempo</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="assets/icons/css/weather-icons.css">
</head>
<body>
  <!-- Container apenas para o card -->
  <div class="container">
    <div class="card" id="card-root">
      <h1>Previsão do Tempo</h1>
      <form id="weather-form">
        <input
          id="city-input"
          type="text"
          placeholder="Digite o nome da cidade"
          required
        />
        <button type="submit">Buscar</button>
      </form>
      <p id="message"></p>
    </div>
  </div>

  <!-- Rodapé separado, sempre no fim -->
  <footer class="site-license">
    <p>
      <span class="icon">🔒</span>
      Esta aplicação não coleta, armazena ou compartilha dados pessoais. 
      As buscas são processadas em tempo real e não são registradas.
    </p>
    <p>
      <span class="icon">🌤️</span>
      Dados meteorológicos fornecidos por 
      <a href="https://open-meteo.com" target="_blank" rel="noopener noreferrer">Open-Meteo.com</a> 
      sob licença 
      <a href="https://creativecommons.org/licenses/by/4.0/" target="_blank" rel="noopener noreferrer">CC BY 4.0</a>.
    </p>
  </footer>

  <script src="api.js"></script>
</body>
</html>
